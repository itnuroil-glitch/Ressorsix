version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: trakio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trakio}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_secure_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trakio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trakio_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_secure_123}
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-trakio}
      JWT_SECRET: ${JWT_SECRET:-trakio_jwt_secret_key_7891234560_secure}
      DISABLE_SMTP: ${DISABLE_SMTP:-false}
      FRONTEND_URL: ${FRONTEND_URL:-*}
    volumes:
      - backend_uploads:/app/upload
      - backend_attachments:/app/Attachment
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  # 3. Nginx + Expo React Native Web Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL_WEB: ${EXPO_PUBLIC_API_URL_WEB:-}
    container_name: trakio_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  backend_attachments:
    driver: local
